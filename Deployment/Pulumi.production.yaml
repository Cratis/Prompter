config:
  prompter-deployment:environment: production
  # Written by the deploy workflow's `init` operation, which commits the generated `encryptionsalt` here.
  # It must stay committed: without it the passphrase cannot decrypt this stack's state.
  # --- Target cluster -------------------------------------------------------
  # The cluster, the `prompter` namespace, the deploy identity and the baseline network policy belong to
  # Cratis/Infrastructure's Core stack. This stack creates only namespaced resources inside it.
  # The cluster-scoped StorageClass Core declares. Referenced, never created.
  prompter-deployment:storageClassName: upcloud-maxiops
  # --- Corpus database ------------------------------------------------------
  prompter-deployment:postgresStorageSizeGb: "10"
  # --- Image ----------------------------------------------------------------
  # Pinned by deploy-production.yml to the released version being deployed; the value committed here is
  # whatever was deployed last.
  prompter-deployment:prompterImage: docker.io/cratis/prompter:0.0.0
  # --- Discord channels (non-secret ids; omit to disable that surface) -------
  # prompter-deployment:askChannelId: "000000000000000000"
  prompter-deployment:helpForumChannelId: "1251463249845817465"
  # --- Tracker bridge (D-16; optional, off until the secrets are set) --------
  # Repositories whose newly-opened issues Prompter may answer, comma-separated owner/name. Empty answers
  # nowhere: commenting on a tracker is opt-in per repository.
  # prompter-deployment:answeringRepositories: "Cratis/Chronicle,Cratis/Arc"
  # Channel that gets the enriched "new issue, and whether the docs already answer it" announcement.
  # prompter-deployment:issueNotifyChannelId: "000000000000000000"
  #
  # --- Secrets --------------------------------------------------------------
  # Secrets are never stored here. The deploy workflow passes them as environment variables from GitHub
  # secrets (PROMPTER_DISCORD_TOKEN, PROMPTER_ANTHROPIC_API_KEY, PROMPTER_VOYAGE_API_KEY,
  # PROMPTER_REINDEX_SECRET and the optional PROMPTER_GITHUB_TOKEN, PROMPTER_GITHUB_WEBHOOK_SECRET), and
  # the Postgres password is generated by Pulumi. See README.md in this folder.
encryptionsalt: v1:k6kL3fgBsns=:v1:KxaGL9tmxnggyURl:gvbsKdDjGPjWn6Y+pXwqWP1tp8KT5w==
