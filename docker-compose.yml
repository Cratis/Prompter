volumes:
  prompter-data:

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      - POSTGRES_DB=prompter
      - POSTGRES_USER=prompter
      - POSTGRES_PASSWORD=prompter
    ports:
      - "${PROMPTER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - prompter-data:/var/lib/postgresql/data
