name: Eval

on:
  pull_request:
    branches: [main]
    paths: ['Eval/**', 'Specs/**', '.github/workflows/eval.yml', 'Source/**', 'Directory.*', 'global.json']
  workflow_dispatch:
    inputs:
      paid:
        description: 'Request protected paid preflight (execution remains disabled pending aggregate budget integration)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build offline specs
        run: dotnet build Specs/Prompter.Specs.csproj --configuration Release --no-incremental
      - name: Run specs executable
        run: dotnet Specs/bin/Release/net10.0/Prompter.Specs.dll
      - name: Check baseline rejection rules
        run: node --test Eval/tests/check-baseline.test.mjs
      - name: Run synthetic evaluation
        run: dotnet Eval/bin/Release/net10.0/Cratis.Prompter.Eval.dll --offline --revision "$GITHUB_SHA" --out Eval/results/offline
      - name: Check synthetic evidence only
        run: node Eval/check-baseline.mjs --synthetic --report Eval/results/offline/report-offline.json --baseline Eval/offline-baseline.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 3
          name: synthetic-eval-report
          path: |
            Eval/results/offline/report-offline.json
            Eval/results/offline/report-offline.md
          if-no-files-found: error

  paid-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.paid && github.ref == 'refs/heads/main'
    environment: eval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      Cratis__PrompterEval__AnthropicApiKey: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
      Cratis__PrompterEval__VoyageApiKey: ${{ secrets.EVAL_VOYAGE_API_KEY }}
    steps:
      - name: Fail closed before any indexing or paid work
        shell: bash
        run: |
          if [ -z "$Cratis__PrompterEval__AnthropicApiKey" ] || [ -z "$Cratis__PrompterEval__VoyageApiKey" ]; then
            echo 'Missing dedicated eval keys.' >&2
            exit 1
          fi
          echo 'Paid evaluation disabled: aggregate budget/admission integration and disposable eval corpus configuration are pending.' >&2
          exit 1
