name: Trigger documentation build

# Thin caller of the organization-wide documentation dispatcher in
# Cratis/Workflows/.github/workflows/trigger-documentation-build.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

  push:
    branches: ["main"]
    paths:
      - "Documentation/**"

permissions:
  contents: read

jobs:
  trigger:
    uses: Cratis/Workflows/.github/workflows/trigger-documentation-build.yml@3f8a8a7ef75f72b6b089638b68ec2f9af8f593e3 # main
    secrets:
      PAT_DOCUMENTATION: ${{ secrets.PAT_DOCUMENTATION }}
