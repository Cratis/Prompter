name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: false
      release-notes:
        description: "Release notes"
        required: false
  pull_request:
    types: [closed]

# Creating the GitHub release needs a write-capable token.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}

    steps:
      - uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish-docker:
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            cratis/prompter:${{ needs.release.outputs.version }}
            cratis/prompter:latest
          build-args: |
            VERSION=${{ needs.release.outputs.version }}

  # Roll the version that was just pushed onto the cluster (D-11 / D-15). Runs only after the image
  # exists, so a failed publish can never deploy a tag that is not there.
  deploy-production:
    if: needs.release.outputs.publish == 'true'
    needs: [release, publish-docker]
    uses: ./.github/workflows/deploy-production.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
