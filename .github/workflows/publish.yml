name: Publish

# Keep every pending release in order: release-action releases one merged pull request per run, and the
# default concurrency keeps only one pending run and cancels the others (Cratis/Workflows#162).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: false
      release-notes:
        description: "Release notes"
        required: false
  # Releasing on push rather than on the pull_request closed event is deliberate. A pull request from a fork
  # runs with a read-only GITHUB_TOKEN and no secrets even on merge, so it cannot create the release or reach
  # the publishing credentials - which is how a merged, labeled fork contribution silently released nothing.
  # A push to main always runs with a full-permission token, and the release action finds the merged pull
  # request and its label from the commit.
  push:
    branches:
      - main

# Creating the GitHub release needs a write-capable token.
permissions:
  issues: write
  contents: write

jobs:
  release:
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release
        id: release
        uses: cratis/release-action@26976c4c37ac8c0454077c0f41abb31650e36405 # v1.5.1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish-docker:
    permissions:
      contents: read
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            cratis/prompter:${{ needs.release.outputs.version }}
            cratis/prompter:latest
          build-args: |
            VERSION=${{ needs.release.outputs.version }}

  # Is there anything to deploy to yet? The stack exists in code but has never been applied, and the
  # secrets it needs may not be set. A `secrets` context cannot be read from a job-level `if`, so the
  # check happens in a step and the deploy is gated on its output — releasing an image stays green
  # while the cluster side is still being set up.
  deployment-configured:
    permissions:
      contents: read
    # The deployment credentials are production environment secrets, so the readiness check runs in that
    # environment too; outside it they read as empty and the deploy is skipped.
    environment: production
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ready: ${{ steps.check.outputs.ready }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check deployment prerequisites
        id: check
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          STATE_BACKEND_ACCESS_KEY_ID: ${{ secrets.STATE_BACKEND_ACCESS_KEY_ID }}
          STATE_BACKEND_SECRET_ACCESS_KEY: ${{ secrets.STATE_BACKEND_SECRET_ACCESS_KEY }}
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -n "${PULUMI_CONFIG_PASSPHRASE}" ] && [ -n "${STATE_BACKEND_ACCESS_KEY_ID}" ] \
            && [ -n "${STATE_BACKEND_SECRET_ACCESS_KEY}" ] && [ -n "${KUBECONFIG_CONTENT}" ] \
            && grep -q '^encryptionsalt:' Deployment/Pulumi.production.yaml; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::The image is published. Deployment needs PULUMI_CONFIG_PASSPHRASE, STATE_BACKEND_ACCESS_KEY_ID, STATE_BACKEND_SECRET_ACCESS_KEY, KUBECONFIG and an initialized stack (encryptionsalt in Deployment/Pulumi.production.yaml) — see Deployment/README.md."
          fi

  # Deploys the just-published image by running `pulumi up` directly against this repo's own Deployment/
  # project: Prompter's Deployment, Postgres and network policy in the `prompter` namespace on the shared cluster,
  # reached through the namespace-scoped KUBECONFIG secret. Mirrors Cratis/Direct's deploy job step-for-step.
  # See Deployment/README.md. Runs only after the image exists, so a failed publish can never deploy a tag
  # that is not there.
  deploy:
    name: Deploy
    environment: production
    if: needs.deployment-configured.outputs.ready == 'true'
    needs: [release, publish-docker, deployment-configured]
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    timeout-minutes: 60
    concurrency:
      group: deploy-prompter-production
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      # The version comes from the release job, but it still reaches shell only through the environment and
      # is validated before any use.
      - name: Validate the version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if ! [[ "${VERSION}" =~ ${semver} ]]; then
            echo "::error::The released version is not a SemVer."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # Keep NuGet packages on the runner's scratch volume beside the checkout, not on the node's small
      # ephemeral storage, where the kubelet evicts the runner under disk pressure.
      - name: Keep NuGet packages on the scratch volume
        shell: bash
        run: echo "NUGET_PACKAGES=$(dirname "$GITHUB_WORKSPACE")/.nuget-packages" >> "$GITHUB_ENV"

      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      # Never roll production back. The deployed version is the image tag of the live Deployment, and every
      # release tag points at the commit that was released, so "older" is an ancestry question. Unknown is
      # not pass: anything other than a missing Deployment (nothing deployed yet, which a deploy must be able
      # to repair) fails the job.
      - name: Refuse to deploy a release older than the one in production
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig-guard"
          printf '%s' "$KUBECONFIG_CONTENT" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          if ! image="$(kubectl -n prompter get deployment prompter -o jsonpath='{.spec.template.spec.containers[0].image}' 2>"$RUNNER_TEMP/guard.err")"; then
            if grep -q NotFound "$RUNNER_TEMP/guard.err"; then
              echo "No prompter Deployment is deployed yet; nothing to roll back."
              exit 0
            fi
            echo "::error title=Deploy guard::Could not read the deployed image: $(cat "$RUNNER_TEMP/guard.err")"
            exit 1
          fi
          deployed="${image##*:}"
          echo "Deployed: $deployed, deploying: $VERSION"
          if [ "$deployed" = "$VERSION" ]; then
            exit 0
          fi
          git fetch --tags --quiet
          if ! git rev-parse -q --verify "refs/tags/v${deployed}^{commit}" >/dev/null; then
            echo "::error title=Deploy guard::The deployed image tag '${deployed}' has no matching release tag v${deployed}, so it cannot be compared with v${VERSION}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "v${deployed}" "v${VERSION}"; then
            echo "::error title=Deploy guard::Production runs ${deployed}, which is not an ancestor of ${VERSION}. Refusing to roll production back to an older commit."
            exit 1
          fi
          echo "v${deployed} is an ancestor of v${VERSION}; deploying."

      - name: Setup .NET (hosted fallback only - baked into the shared runner image)
        if: runner.environment != 'self-hosted'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Install Pulumi CLI (hosted fallback only - baked into the shared runner image)
        if: runner.environment != 'self-hosted'
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # `pulumi config set` preserves the config file's comments/structure (a raw YAML edit would not).
      # State is self-managed on UpCloud Object Storage (S3-compatible); Deployment/Pulumi.yaml's backend.url
      # points there, so every pulumi command needs the state bucket's access key as AWS_ACCESS_KEY_ID and
      # AWS_SECRET_ACCESS_KEY. The checksum env vars work around a known aws-sdk-go-v2 regression against
      # non-AWS S3-compatible endpoints on Pulumi < 3.261.0.
      - name: Pin image version
        working-directory: Deployment
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_BACKEND_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_BACKEND_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # The full Docker Hub reference: Prompter's image is public, so there is no registry to resolve against.
          pulumi config set --stack production "prompter-deployment:prompterImage" "docker.io/cratis/prompter:${VERSION}"

      # `refresh: true` reads the cluster before planning. Without it Pulumi plans against state alone, so a
      # resource that no longer exists in the cluster is planned as already correct and `up` reports success
      # while production stays down.
      - name: Deploy Prompter stack
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          refresh: true
          stack-name: production
          work-dir: Deployment
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_BACKEND_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_BACKEND_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          PROMPTER_KUBECONFIG: ${{ secrets.KUBECONFIG }}
          PROMPTER_DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          PROMPTER_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPTER_VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          PROMPTER_REINDEX_SECRET: ${{ secrets.REINDEX_SECRET }}
          PROMPTER_GITHUB_TOKEN: ${{ secrets.PROMPTER_GITHUB_TOKEN }}
          PROMPTER_GITHUB_WEBHOOK_SECRET: ${{ secrets.PROMPTER_GITHUB_WEBHOOK_SECRET }}

  verify-published:
    permissions: {}
    # A merge that publishes nothing is the failure mode that silently costs a release: the release job
    # succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did.
    #
    # Only for the reasons that mean something went wrong. Publishing nothing is correct and routine for the
    # others - a commit pushed straight to main, a Dependabot merge, a re-run of a run that already released -
    # and failing on those would make this job noise that everyone learns to ignore.
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::Nothing was published and no release was cut (reason: ${{ needs.release.outputs.reason }}). For 'no-label', add exactly one of major, minor or patch to the merged pull request and re-run this workflow - see verify-semver-label, which is meant to catch this before the merge."
          exit 1
