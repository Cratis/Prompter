name: Build

env:
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "Source/**"
      - "Specs/**"
      - "Deployment/**"
      - "Docker/**"
  pull_request:
    branches:
      - "main"
    paths:
      - "Source/**"
      - "Specs/**"
      - "Deployment/**"
      - "Docker/**"

jobs:
  dotnet-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

  # The image is what actually ships, and nothing verified it until Publish tried to push one — which is
  # how a runtime base-image tag that does not exist got released. Build it here (native architecture, no
  # push; Publish still does the multi-arch build) so a broken image fails on the pull request instead.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Docker/Dockerfile
          push: false
          build-args: |
            VERSION=0.0.0-ci
