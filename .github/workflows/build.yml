name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "Source/**"
      - "Specs/**"
      - "Deployment/**"
      - "Docker/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/build.yml"
      - ".github/workflows/postgres-backups.yml"
      - ".github/workflows/reindex-production.yml"
      - ".github/scripts/**"
      - "Monitoring/**"
  pull_request:
    branches:
      - "main"
    paths:
      - "Source/**"
      - "Specs/**"
      - "Deployment/**"
      - "Docker/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/build.yml"
      - ".github/workflows/postgres-backups.yml"
      - ".github/workflows/reindex-production.yml"
      - ".github/scripts/**"
      - "Monitoring/**"

jobs:
  monitoring-specs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate monitoring artifacts and notification behavior
        run: node --test Monitoring/specs/*.spec.mjs
      - name: Check failure notifier syntax
        run: node --check .github/scripts/notify-reindex-failure.mjs
      - name: Check scheduled indexing offline
        run: node --test Specs/ScheduledIndexing/*.test.mjs
      - name: Validate index Job manifests
        run: bash Deployment/scripts/run-index-job.spec.sh
      - name: Lint index Job scripts
        run: shellcheck Deployment/scripts/run-index-job.sh Deployment/scripts/run-index-job.spec.sh
  dotnet-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      ledger:
        image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Run specifications
        env:
          PROMPTER_LEDGER_TEST_PORT: "5432"
          PROMPTER_RETRIEVAL_TEST_PORT: "5432"
        run: ./Specs/bin/Release/net10.0/Prompter.Specs

      - name: Check Postgres backup scripts offline
        run: node --test Specs/PostgresBackups/offline.test.mjs

      - name: Lint Postgres backup scripts
        run: shellcheck Deployment/scripts/backup-postgres.sh Deployment/scripts/restore-postgres-test.sh Deployment/scripts/postgres-backup-common.sh Deployment/scripts/run-postgres-job.sh

  # The image is what actually ships, and nothing verified it until Publish tried to push one — which is
  # how a runtime base-image tag that does not exist got released. Build it here (native architecture, no
  # push; Publish still does the multi-arch build) so a broken image fails on the pull request instead.
  docker-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Docker/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=prompter-image-ci
          cache-to: type=gha,mode=max,scope=prompter-image-ci
          build-args: |
            VERSION=0.0.0-ci
