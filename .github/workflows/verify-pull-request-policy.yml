name: Verify Pull Request Policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  dependabot-labels:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    uses: Cratis/Workflows/.github/workflows/normalize-dependabot-labels.yml@3f8a8a7ef75f72b6b089638b68ec2f9af8f593e3 # main
    permissions:
      pull-requests: write

  policy:
    needs: dependabot-labels
    if: ${{ !cancelled() }}
    uses: Cratis/Workflows/.github/workflows/verify-pull-request-policy.yml@3f8a8a7ef75f72b6b089638b68ec2f9af8f593e3 # main
    with:
      runs-on: ${{ vars.RUNNER_GATE || 'ubuntu-latest' }}
      release-intent: true
