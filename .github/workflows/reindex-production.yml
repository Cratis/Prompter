#
# No public route by decision. The deploy identity cannot port-forward and has no CronJob verbs,
# but it can create Jobs. The production environment restricts runs to main.
# No pull_request trigger: forks never reach the self-hosted runner.
name: Reindex - Production

on:
  workflow_dispatch:
    inputs:
      full:
        description: Regenerate every embedding (requires approved full-rebuild budget)
        type: boolean
        default: false
      confirmation:
        description: Type FULL REINDEX to authorize a full rebuild
        type: string
        default: ""
  schedule:
    # Daily at 03:52 UTC: a minute unique in the organization, inside the 03:00-07:00 UTC window.
    - cron: "52 3 * * *"

concurrency:
  group: prompter-production-operations
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  reindex:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.PROMPTER_SCHEDULED_INDEXING_ENABLED == 'true'))
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate index Job manifests
        run: bash Deployment/scripts/run-index-job.spec.sh

      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Re-index the deployed corpus
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          PROMPTER_INDEX_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.full && 'full' || 'incremental' }}
          PROMPTER_INDEX_CONFIRMATION: ${{ inputs.confirmation }}
          PROMPTER_SCHEDULED_INDEXING_ENABLED: ${{ vars.PROMPTER_SCHEDULED_INDEXING_ENABLED }}
          PROMPTER_INDEX_MODEL: voyage-4
          PROMPTER_INDEX_PRICE_PER_MILLION_TOKENS: '0.06'
          PROMPTER_INDEX_MAX_RUN_DOLLARS: '0.10'
          PROMPTER_INDEX_MAX_DAILY_DOLLARS: '0.50'
        run: |
          set -euo pipefail
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          Deployment/scripts/run-index-job.sh

      - name: Notify reindex failure
        if: ${{ failure() || cancelled() }}
        env:
          PROMPTER_ALERT_WEBHOOK: ${{ secrets.PROMPTER_ALERT_WEBHOOK }}
          REINDEX_JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/notify-reindex-failure.mjs

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
