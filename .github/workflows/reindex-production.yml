#
# No public route by decision. The deploy identity cannot port-forward and has no CronJob verbs,
# but it can create Jobs. The production environment restricts runs to main.
# No pull_request trigger: forks never reach the self-hosted runner.
name: Reindex - Production

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:52 UTC: a minute unique in the organization, inside the 03:00-07:00 UTC window.
    - cron: "52 3 * * *"

concurrency:
  group: reindex-prompter-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reindex:
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Re-index the deployed corpus
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          Deployment/scripts/run-index-job.sh

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
