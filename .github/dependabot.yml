version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["no-release"]
    open-pull-requests-limit: 5
    groups:
      cratis-workflows:
        patterns: ["Cratis/Workflows*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["Cratis/Workflows*"]
